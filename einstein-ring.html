<!DOCTYPE html>
<html lang="en">
<head>
<script id="lumi-getcssvar">
window.getCssVar = window.getCssVar || function(name) {
  try {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  } catch (e) { return ''; }
};
</script>

<script id="lumi-canvas-guard">
(function() {
  if (window.__lumiCanvasGuard) return;
  window.__lumiCanvasGuard = true;
  var MAX_PX = 4096, MIN_FONT_PX = 12;
  try {
    var CP = HTMLCanvasElement.prototype;
    var BOX = {width: 'clientWidth', height: 'clientHeight'}, D = {};
    Object.keys(BOX).forEach(function(p) {
      D[p] = Object.getOwnPropertyDescriptor(CP, p);
    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];
    };
    var MAX = {width: 'maxWidth', height: 'maxHeight'};
    var PAD = {width: ['paddingLeft', 'paddingRight'],
               height: ['paddingTop', 'paddingBottom']};
    var avail = function(el, p) {
      var pe = el.parentElement;
      if (!pe) return 0;
      var cs = getComputedStyle(pe);
      return pe[BOX[p]] - parseFloat(cs[PAD[p][0]]) -
          parseFloat(cs[PAD[p][1]]);
    };
    Object.keys(BOX).forEach(function(p) {
      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {
        configurable: true, enumerable: d.enumerable, get: d.get,
        set: function(v) {
          var n = +v, box = this[BOX[p]];
          if (n > MAX_PX) n = MAX_PX;
          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];
            });
            Object.keys(pins).forEach(function(q) {
              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';
            });
            n = box;
          }
          this['__lumiBox' + p] = box;
          this['__lumiLast' + p] = n;
          d.set.call(this, isNaN(n) ? v : n);
        }
      });
    });
  } catch (e) {}
  try {
    var XP = CanvasRenderingContext2D.prototype;
    var px = /(\d*\.?\d+)px/;
    var floorFont = function(ctx) {
      var f = ctx.font, m = px.exec(f);
      if (m && +m[1] >= 4 && +m[1] < MIN_FONT_PX) ctx.font = f.replace(px, MIN_FONT_PX + 'px');
    };
    ['fillText', 'strokeText', 'measureText'].forEach(function(k) {
      var o = XP[k];
      if (typeof o !== 'function') return;
      XP[k] = function() { floorFont(this); return o.apply(this, arguments); };
    });
  } catch (e) {}
})();
</script>

<style id="lumi-runtime">
/* luminous.css */
/*
 * Luminous runtime stylesheet — injected once into every generated widget's
 * <head> by the C++ widget agent (id="lumi-runtime"). Single Source of Truth
 * for ALL design tokens and pre-baked .lumi-* component classes. The SI prompts
 * (design.md / html_generation.jinja2 / chart.jinja2) must NOT re-declare these
 * tokens or component CSS; they only reference them.
 *
 * Sections:
 *   1. Web fonts (Google Sans Flex + Google Sans Code)
 *   2. Light token :root (from previewer tokens.css, verbatim)
 *   3. Dark token overrides — REMAPPED to :root so canvas/D3 readers of
 *      getComputedStyle(document.documentElement) resolve dark values (D3).
 *   4. Short diagram/chart aliases (bridge legacy --surface / --chart-N names).
 *   5. In-scope pre-baked .lumi-* component classes.
 */

/* ============================================================
 * 1. WEB FONTS  (Google Sans Flex + Google Sans Code only)
 *    Material Symbols Outlined is intentionally NOT loaded: no in-scope
 *    .lumi-* control has a functional CSS glyph dependency on it, and the
 *    icon ban forbids decorative icons (Decision D2).
 * ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,300..700;1,300..700&family=Google+Sans+Code:ital,wght,MONO@0,300..700,0..1;1,300..700,0..1&display=swap');

/* ============================================================
 * 2. LIGHT TOKENS (:root)
 * ============================================================ */
:root {
  --body-bg: transparent;
  --ff-sans: 'Google Sans Flex', 'Google Sans Text', 'Google Sans', sans-serif;
  --ff-mono: 'Google Sans Code', 'Google Sans Mono', monospace;

  --lumi-sys-spacing--xxs: 2px;
  --lumi-sys-spacing--xs: 4px;
  --lumi-sys-spacing--s: 8px;
  --lumi-sys-spacing--m: 12px;

/* ============================================================

    --lumi-sys-color--error: #ff4c45;

/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  /* foreground */
  --on-surface: var(--lumi-sys-color--on-surface, #000000);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.55));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */
  --primary: var(--lumi-sys-color--primary, #3186ff);
  --primary-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent-fixed: var(--lumi-sys-color--accent-fixed, #3186ff);
  /* status */
  --positive: var(--lumi-sys-color--positive, #008052);
  --positive-container: var(--lumi-sys-color--positive-container, #daf9d4);
  --error: var(--lumi-sys-color--error, #de2d29);
  --error-container: var(--lumi-sys-color--error-container, #ffdeec);
  /* structure */
  --outline: var(--lumi-sys-color--outline, #727676);
  --stroke-default: var(--lumi-sys-color--stroke-default, #e3e3e3);
  /* chart series 1..10 */
  --chart-1: var(--lumi-sys-color--chart-series-1, #2575fc);
  --chart-2: var(--lumi-sys-color--chart-series-2, #5b6e9e);
  --chart-3: var(--lumi-sys-color--chart-series-3, #228a49);
  --chart-4: var(--lumi-sys-color--chart-series-4, #62991b);
  --chart-5: var(--lumi-sys-color--chart-series-5, #1e564d);
  --chart-6: var(--lumi-sys-color--chart-series-6, #526a45);
  --chart-7: var(--lumi-sys-color--chart-series-7, #2780c4);
  --chart-8: var(--lumi-sys-color--chart-series-8, #997112);
  --chart-9: var(--lumi-sys-color--chart-series-9, #705ec2);
  --chart-10: var(--lumi-sys-color--chart-series-10, #c84288);
  /* code palette */
  --code-background: var(--lumi-sys-color--code-background, #000000);
  --code-primary-text: var(--lumi-sys-color--code-primary-text, #ffffff);
  /* spacing shorthands */
  --spacing-xs: var(--lumi-sys-spacing--xs, 4px);
  --spacing-s: var(--lumi-sys-spacing--s, 8px);
  --spacing-m: var(--lumi-sys-spacing--m, 12px);
  --spacing-l: var(--lumi-sys-spacing--l, 16px);
  --spacing-xl: var(--lumi-sys-spacing--xl, 20px);
  /* radius shorthands */
  --r-s: var(--lumi-sys-shape--small, 8px);
  --r-m: var(--lumi-sys-shape--medium, 12px);
  --r-l: var(--lumi-sys-shape--large, 16px);
  --r-full: var(--lumi-sys-shape--full, 999px);
}

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();
</script>

  <div class="widget-container">

    <!-- Controls -->
    <div class="control-deck">
      <div class="control-row">
        <label class="control-label" for="slider-mass">Lens Mass (M<sub>☉</sub>)</label>
        <div class="lumi-slider-container">
          <input type="range" id="slider-mass" class="lumi-slider" data-key="mass" min="0" max="10" step="0.1" value="5.0" style="--progress: 50%;">
          <div id="slider-mass-val" class="lumi-slider-value">5.0</div>
        </div>
      </div>

      <div class="control-row">
        <label class="control-label" for="slider-offset">Source Y-Offset (ΔY)</label>
        <div class="lumi-slider-container">
          <input type="range" id="slider-offset" class="lumi-slider" data-key="yOffset" min="-40" max="40" step="1" value="0" style="--progress: 50%;">
          <div id="slider-offset-val" class="lumi-slider-value">0</div>
        </div>
      </div>

      <div class="control-row">
        <label class="control-label" for="slider-dist">Lens Distance (D<sub>L</sub>)</label>
        <div class="lumi-slider-container">
          <input type="range" id="slider-dist" class="lumi-slider" data-key="lensDist" min="0.2" max="0.8" step="0.01" value="0.5" style="--progress: 50%;">
          <div id="slider-dist-val" class="lumi-slider-value">0.50</div>
        </div>

      </div>

  <script>
    function getCssVar(name) {
      if (!name) return '';
      const clean = name.replace(/^var\(/, '').replace(/\)$/, '').trim();
      return getComputedStyle(document.documentElement).getPropertyValue(clean.startsWith('--') ? clean : '--' + clean).trim();
    }

    // Default simulation state
    const DEFAULTS = {
      mass: 5.0,
      yOffset: 0,
      lensDist: 0.50
    };

    const state = { ...DEFAULTS };

    // Canvas & Animation Handles
    let sideCanvas, sideCtx, obsCanvas, obsCtx;
    let animFrameId = null;
    let particles = [];
    let isDraggingLens = false;

    // Initialize particles
    function initParticles() {
      particles = [];
      const numParticles = 36;
      for (let i = 0; i < numParticles; i++) {
        particles.push({
          progress: Math.random(),
          rayIndex: Math.floor(Math.random() * 9),
          speed: 0.004 + Math.random() * 0.003
        });
      }
    }

    function init() {
      sideCanvas = document.getElementById('sideCanvas');
      sideCtx = sideCanvas.getContext('2d');
      obsCanvas = document.getElementById('obsCanvas');
      obsCtx = obsCanvas.getContext('2d', { willReadFrequently: true });

      initParticles();
      setupEvents();
      syncSliderProps();
      updateViz();
    }

    function syncSliderProps() {
      document.querySelectorAll('.lumi-slider').forEach(slider => {
        const key = slider.dataset.key;
        if (state[key] !== undefined) {
          slider.value = state[key];
          const pct = (slider.value - slider.min) / (slider.max - slider.min) * 100;
          slider.style.setProperty('--progress', pct + '%');
          const valBadge = document.getElementById(`${slider.id}-val`);
          if (valBadge) {
            if (valBadge) valBadge.textContent = key === 'lensDist' ? parseFloat(slider.value).toFixed(2) : slider.value;
          }
        }
      });
    }

    function setupEvents() {
      document.querySelectorAll('.lumi-slider').forEach(slider => {
        slider.addEventListener('input', (e) => {
          const key = e.target.dataset.key;
          state[key] = parseFloat(e.target.value);
          const pct = (e.target.value - e.target.min) / (e.target.max - e.target.min) * 100;
          e.target.style.setProperty('--progress', pct + '%');
          const valBadge = document.getElementById(`${e.target.id}-val`);
          if (valBadge) {
            if (valBadge) valBadge.textContent = key === 'lensDist' ? state[key].toFixed(2) : state[key];
          }
          updateViz();
        });
      });

      document.getElementById('btn-reset').addEventListener('click', () => {
        Object.assign(state, DEFAULTS);
        syncSliderProps();
        updateViz();
      });

      // Direct dragging of lens on side canvas
      const sideWrapper = document.getElementById('side-wrapper');
      
      const handlePointerDown = (e) => {
        const rect = sideCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = clientX - rect.left;
        const w = rect.width;
        
        // Lens position in x is between 0.2 and 0.8 fraction
        const sourceX = 50;
        const obsX = w - 50;
        const lensX = sourceX + state.lensDist * (obsX - sourceX);
        
        if (Math.abs(x - lensX) < 30) {
          isDraggingLens = true;
        }
      };

      const handlePointerMove = (e) => {
        if (!isDraggingLens) return;
        const rect = sideCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = clientX - rect.left;
        const w = rect.width;
        
        const sourceX = 50;
        const obsX = w - 50;
        let frac = (x - sourceX) / (obsX - sourceX);
        frac = Math.max(0.2, Math.min(0.8, frac));
        
        state.lensDist = parseFloat(frac.toFixed(2));
        syncSliderProps();
        updateViz();
      };

      const handlePointerUp = () => { isDraggingLens = false; };

      sideWrapper.addEventListener('mousedown', handlePointerDown);
      window.addEventListener('mousemove', handlePointerMove);
      window.addEventListener('mouseup', handlePointerUp);

      sideWrapper.addEventListener('touchstart', handlePointerDown, { passive: true });
      window.addEventListener('touchmove', handlePointerMove, { passive: true });
      window.addEventListener('touchend', handlePointerUp);
    }

    function setupCanvasDPR(canvas, ctx) {
      const parent = canvas.parentElement;
      const w = parent.clientWidth || 600;
      const h = parent.clientHeight || 180;
      const dpr = window.devicePixelRatio || 1;
      
      if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w, h };
    }

    // Mathematical Ray Tracing simulation for Side View
    function computeRayPath(sourcePos, lensPos, targetY, mass, numSteps = 100) {
      const path = [];
      let x = sourcePos.x;
      let y = sourcePos.y;
      
      // Calculate initial launch angle aimed roughly towards targetY at observer
      const dxTotal = 500; // normalized scale
      const dyTotal = targetY - sourcePos.y;
      let vy = dyTotal / numSteps;
      let vx = (lensPos.x - sourcePos.x) / (numSteps * state.lensDist);

      const dt = 1.0;
      const pathPoints = [{ x, y }];

      for (let i = 0; i < numSteps; i++) {
        const dx = x - lensPos.x;
        const dy = y - lensPos.y;
        const r2 = dx * dx + dy * dy + 100; // softening factor
        const r = Math.sqrt(r2);

        // Gravitational deflection acceleration perpendicular to path
        const force = (mass * 180) / r2;
        const ax = -force * (dx / r);
        const ay = -force * (dy / r);

        vx += ax * dt;
        vy += ay * dt;

        x += vx * dt;
        y += vy * dt;

        pathPoints.push({ x, y });
        if (x >= lensPos.x + (500 - lensPos.x)) break;
      }

      return pathPoints;
    }

    function renderSideView(w, h) {
      sideCtx.clearRect(0, 0, w, h);

      // Colors from theme
      const primaryColor = getCssVar('--primary') || '#3186ff';
      const chart1Color = getCssVar('--chart-1') || '#2575fc';
      const chart2Color = getCssVar('--chart-2') || '#5b6e9e';
      const outlineColor = getCssVar('--outline') || '#727676';

      const sourceX = 40;
      const obsX = w - 40;
      const cy = h / 2;
      const sourceY = cy + state.yOffset;
      const lensX = sourceX + state.lensDist * (obsX - sourceX);
      const lensY = cy;

      // Draw Spacetime Grid Distortion background
      sideCtx.lineWidth = 1;
      const gridSpacing = 20;
      sideCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      
      for (let gx = 0; gx < w; gx += gridSpacing) {
        sideCtx.beginPath();
        for (let gy = 0; gy < h; gy += 5) {
          const dx = gx - lensX;
          const dy = gy - lensY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const warp = (state.mass * 25) / (dist + 30);
          const wx = gx - (dx / (dist + 1)) * warp;
          const wy = gy - (dy / (dist + 1)) * warp;
          
          if (gy === 0) sideCtx.moveTo(wx, wy);
          else sideCtx.lineTo(wx, wy);
        }
        sideCtx.stroke();
      }

      for (let gy = 0; gy < h; gy += gridSpacing) {
        sideCtx.beginPath();
        for (let gx = 0; gx < w; gx += 5) {
          const dx = gx - lensX;
          const dy = gy - lensY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const warp = (state.mass * 25) / (dist + 30);
          const wx = gx - (dx / (dist + 1)) * warp;
          const wy = gy - (dy / (dist + 1)) * warp;

          if (gx === 0) sideCtx.moveTo(wx, wy);
          else sideCtx.lineTo(wx, wy);
        }
        sideCtx.stroke();
      }

      // Optical Axis Line
      sideCtx.beginPath();
      sideCtx.setLineDash([4, 4]);
      sideCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      sideCtx.moveTo(0, cy);
      sideCtx.lineTo(w, cy);
      sideCtx.stroke();
      sideCtx.setLineDash([]);

      // Compute Ray Fan
      const rayCount = 9;
      const rayPaths = [];
      const fanSpread = 70;

      for (let i = 0; i < rayCount; i++) {
        const targetY = cy - fanSpread / 2 + (i / (rayCount - 1)) * fanSpread;
        
        // Interpolated trajectory
        const steps = 60;
        const points = [];
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const px = sourceX + t * (obsX - sourceX);
          
          // Unbent line
          let py = sourceY + t * (targetY - sourceY);
          
          // Gravitational bending displacement towards lens
          const dx = px - lensX;
          const impactParam = Math.abs(sourceY - lensY) + Math.abs(targetY - cy) * 0.5 + 15;
          const bendFactor = (state.mass * 4000) / (dx * dx + impactParam * impactParam + 400);
          const influence = Math.sin(t * Math.PI); // max at lens
          
          // Direction of pull toward lens center
          const pullSign = py > lensY ? -1 : 1;
          py += pullSign * bendFactor * influence;

          points.push({ x: px, y: py });
        }
        rayPaths.push(points);
      }

      // Render Ray Paths
      rayPaths.forEach((pts, idx) => {
        sideCtx.beginPath();
        sideCtx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          sideCtx.lineTo(pts[i].x, pts[i].y);
        }
        const isCenter = idx === Math.floor(rayCount / 2);
        sideCtx.strokeStyle = isCenter ? 'rgba(157, 210, 255, 0.85)' : 'rgba(49, 134, 255, 0.35)';
        sideCtx.lineWidth = isCenter ? 2 : 1;
        sideCtx.stroke();
      });

      // Render Animated Photons
      particles.forEach(p => {
        p.progress += p.speed;
        if (p.progress > 1) p.progress = 0;
        
        const pts = rayPaths[p.rayIndex % rayPaths.length];
        const indexFloat = p.progress * (pts.length - 1);
        const idx0 = Math.floor(indexFloat);
        const idx1 = Math.min(pts.length - 1, idx0 + 1);
        const alpha = indexFloat - idx0;

        const px = pts[idx0].x + alpha * (pts[idx1].x - pts[idx0].x);
        const py = pts[idx0].y + alpha * (pts[idx1].y - pts[idx0].y);

        sideCtx.beginPath();
        sideCtx.arc(px, py, 2, 0, Math.PI * 2);
        sideCtx.fillStyle = '#ffffff';
        sideCtx.shadowColor = primaryColor;
        sideCtx.shadowBlur = 6;
        sideCtx.fill();
        sideCtx.shadowBlur = 0;
      });

      // Draw Objects (Source, Lens, Observer)
      // 1. Source Galaxy (Far Left)
      sideCtx.beginPath();
      sideCtx.arc(sourceX, sourceY, 8, 0, Math.PI * 2);
      sideCtx.fillStyle = '#ff9d5c';
      sideCtx.shadowColor = '#ff9d5c';
      sideCtx.shadowBlur = 12;
      sideCtx.fill();
      sideCtx.shadowBlur = 0;
      
      sideCtx.font = "11px 'Google Sans Code', monospace";
      sideCtx.fillStyle = 'rgba(255,255,255,0.7)';
      sideCtx.fillText('Source', sourceX - 18, sourceY - 14);

      // 2. Foreground Lens Massive Body (Center)
      const lensRadius = 6 + state.mass * 1.2;
      
      // Gravitational halo glow
      const haloGrad = sideCtx.createRadialGradient(lensX, lensY, 2, lensX, lensY, lensRadius * 2.5);
      haloGrad.addColorStop(0, 'rgba(157, 210, 255, 0.6)');
      haloGrad.addColorStop(1, 'rgba(157, 210, 255, 0)');
      sideCtx.beginPath();
      sideCtx.arc(lensX, lensY, lensRadius * 2.5, 0, Math.PI * 2);
      sideCtx.fillStyle = haloGrad;
      sideCtx.fill();

      // Lens Mass Body
      sideCtx.beginPath();
      sideCtx.arc(lensX, lensY, lensRadius, 0, Math.PI * 2);
      sideCtx.fillStyle = '#0f172a';
      sideCtx.strokeStyle = primaryColor;
      sideCtx.lineWidth = 2;
      sideCtx.fill();
      sideCtx.stroke();

      sideCtx.fillStyle = 'rgba(255,255,255,0.9)';
      sideCtx.fillText('Lens (M)', lensX - 20, lensY - lensRadius - 8);

      // 3. Observer / Telescope (Far Right)
      sideCtx.beginPath();
      sideCtx.arc(obsX, cy, 6, 0, Math.PI * 2);
      sideCtx.fillStyle = '#50e389';
      sideCtx.shadowColor = '#50e389';
      sideCtx.shadowBlur = 8;
      sideCtx.fill();
      sideCtx.shadowBlur = 0;

      sideCtx.fillStyle = 'rgba(255,255,255,0.7)';
      sideCtx.fillText('Earth', obsX - 12, cy - 12);

      // Update deflection readout
      const maxAngle = (state.mass * 2.4 * (1.0 / state.lensDist)).toFixed(1);
      document.getElementById('deflection-angle-readout').textContent = `Deflection: ${maxAngle}°`;
    }

    // Optical distortion rendering for Observer View
    function renderObserverView(w, h) {
      obsCtx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;

      // Fill background dark deep-space
      obsCtx.fillStyle = '#05070c';
      obsCtx.fillRect(0, 0, w, h);

      // Draw faint telescope reticle / grid
      obsCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      obsCtx.lineWidth = 1;
      
      obsCtx.beginPath();
      obsCtx.arc(cx, cy, 30, 0, Math.PI * 2);
      obsCtx.arc(cx, cy, 60, 0, Math.PI * 2);
      obsCtx.arc(cx, cy, 90, 0, Math.PI * 2);
      obsCtx.moveTo(cx - 100, cy); obsCtx.lineTo(cx + 100, cy);
      obsCtx.moveTo(cx, cy - 100); obsCtx.lineTo(cx, cy + 100);
      obsCtx.stroke();

      // Einstein Ring Radius theta_E calculation
      // theta_E ~ sqrt(M * D_LS / (D_L * D_S))
      const dL = state.lensDist;
      const dS = 1.0;
      const dLS = dS - dL;
      const einsteinRadius = Math.sqrt(state.mass * (dLS / (dL * dS))) * 22;

      document.getElementById('einstein-radius-readout').innerHTML = `&theta;<sub>E</sub>: ${(einsteinRadius * 1.8).toFixed(1)} mas`;

      // Source true offset vector
      const betaY = state.yOffset * 0.85; // aligned on Y axis
      const betaX = 0;
      const betaDist = Math.abs(betaY);

      // Render Lensed Galaxy Images / Arcs using pixel mapping for smooth distorted optical arcs
      const imgData = obsCtx.createImageData(w, h);
      const data = imgData.data;

      // Source galaxy parameters
      const sourceRadius = 12;
      const sourceRad2 = sourceRadius * sourceRadius;

      // We scan around the viewport center
      const renderRadius = Math.min(w, h) / 2 - 5;
      const minX = Math.floor(cx - renderRadius);
      const maxX = Math.ceil(cx + renderRadius);
      const minY = Math.floor(cy - renderRadius);
      const maxY = Math.ceil(cy + renderRadius);

      for (let y = minY; y < maxY; y++) {
        for (let x = minX; x < maxX; x++) {
          const dx = x - cx;
          const dy = y - cy;
          const theta2 = dx * dx + dy * dy;
          const theta = Math.sqrt(theta2);

          if (theta < 2 || theta > renderRadius) continue;

          // Gravitational Lens Equation mapping: beta = theta - theta_E^2 / theta
          const deflection = (einsteinRadius * einsteinRadius) / theta;
          const mapX = dx - (dx / theta) * deflection;
          const mapY = dy - (dy / theta) * deflection;

          // Distance from mapped ray to true background galaxy position (betaX, betaY)
          const distToSource2 = (mapX - betaX) * (mapX - betaX) + (mapY - betaY) * (mapY - betaY);

          if (distToSource2 < sourceRad2 * 2.5) {
            const intensity = Math.exp(-distToSource2 / (sourceRad2 * 0.8));
            
            // Amplification factor (Jacobian determinant approximation)
            const amp = Math.min(3.5, 1.0 / Math.max(0.1, Math.abs(1.0 - (einsteinRadius * einsteinRadius) / theta2)));
            
            const pxIdx = (y * w + x) * 4;
            
            // Galaxy hue (warm orange-gold core with bright blue lensed arcs)
            const r = Math.min(255, Math.floor((220 + amp * 10) * intensity));
            const g = Math.min(255, Math.floor((150 + amp * 25) * intensity));
            const b = Math.min(255, Math.floor((255) * intensity));
            const a = Math.min(255, Math.floor(intensity * amp * 220));

            data[pxIdx] = r;
            data[pxIdx + 1] = g;
            data[pxIdx + 2] = b;
            data[pxIdx + 3] = a;
          }
        }
      }

      obsCtx.putImageData(imgData, 0, 0);

      // Overlay Central Dark Matter Lens Body & Accretion Halo
      const lensRadiusObs = 4 + state.mass * 0.8;
      
      // Dark central body
      obsCtx.beginPath();
      obsCtx.arc(cx, cy, lensRadiusObs, 0, Math.PI * 2);
      obsCtx.fillStyle = '#020408';
      obsCtx.fill();
      obsCtx.strokeStyle = 'rgba(157, 210, 255, 0.5)';
      obsCtx.lineWidth = 1.5;
      obsCtx.stroke();

      // Show True Unlensed Source position ring (dotted helper)
      if (Math.abs(state.yOffset) > 2) {
        obsCtx.beginPath();
        obsCtx.setLineDash([2, 3]);
        obsCtx.arc(cx + betaX, cy + betaY, sourceRadius, 0, Math.PI * 2);
        obsCtx.strokeStyle = 'rgba(255, 157, 92, 0.4)';
        obsCtx.stroke();
        obsCtx.setLineDash([]);
        
        obsCtx.font = "10px 'Google Sans Code', monospace";
        obsCtx.fillStyle = 'rgba(255, 157, 92, 0.6)';
        obsCtx.fillText('True Source', cx + betaX + 15, cy + betaY + 3);
      }

      // Einstein Ring Indicator when aligned
      if (einsteinRadius > 5 && Math.abs(state.yOffset) < 3) {
        obsCtx.beginPath();
        obsCtx.arc(cx, cy, einsteinRadius, 0, Math.PI * 2);
        obsCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        obsCtx.setLineDash([3, 3]);
        obsCtx.stroke();
        obsCtx.setLineDash([]);
      }
    }

    function updateViz() {
      if (animFrameId) cancelAnimationFrame(animFrameId);

      function loop() {
        const sideDim = setupCanvasDPR(sideCanvas, sideCtx);
        const obsDim = setupCanvasDPR(obsCanvas, obsCtx);

        renderSideView(sideDim.w, sideDim.h);
        renderObserverView(obsDim.w, obsDim.h);

        animFrameId = requestAnimationFrame(loop);
      }

      loop();
    }

    // Initialize on load
    window.addEventListener('load', () => {
      init();
    });

    // Theme & Resize Sync
    const applyTheme = t => {
      document.documentElement.setAttribute('data-theme', t);
      if (typeof updateViz === 'function') updateViz();
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }
    window.addEventListener('message', e => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') applyTheme(e.data.theme);
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({ type: 'widget-resize', height: h }, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>

<script>/*luminous-slider-normalizer*/(function(){function f(r){if(!r||r.type!=='range')return;var mn=parseFloat(r.min||'0'),mx=parseFloat(r.max||'100'),v=parseFloat(r.value);if(isNaN(v))v=(mn+mx)/2;var p=mx>mn?((v-mn)/(mx-mn))*100:50;r.style.setProperty('--progress',p+'%');r.style.removeProperty('--slider-fill');}function all(){document.querySelectorAll('input[type="range"], .lumi-slider').forEach(f);}document.addEventListener('input',function(e){f(e.target);});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',all);else all();})();</script>
