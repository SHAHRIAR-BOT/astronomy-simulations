<!DOCTYPE html>
<html lang="en">
<head>
<script id="lumi-getcssvar">
window.getCssVar = window.getCssVar || function(name) {
  try {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  } catch (e) { return ''; }
};
</script>

<script id="lumi-canvas-guard">
(function() {
  if (window.__lumiCanvasGuard) return;
  window.__lumiCanvasGuard = true;
  var MAX_PX = 4096, MIN_FONT_PX = 12;
  try {
    var CP = HTMLCanvasElement.prototype;
    var BOX = {width: 'clientWidth', height: 'clientHeight'}, D = {};
    Object.keys(BOX).forEach(function(p) {
      D[p] = Object.getOwnPropertyDescriptor(CP, p);
    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];
    };
    var MAX = {width: 'maxWidth', height: 'maxHeight'};
    var PAD = {width: ['paddingLeft', 'paddingRight'],
               height: ['paddingTop', 'paddingBottom']};
    var avail = function(el, p) {
      var pe = el.parentElement;
      if (!pe) return 0;
      var cs = getComputedStyle(pe);
      return pe[BOX[p]] - parseFloat(cs[PAD[p][0]]) -
          parseFloat(cs[PAD[p][1]]);
    };
    Object.keys(BOX).forEach(function(p) {
      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {
        configurable: true, enumerable: d.enumerable, get: d.get,
        set: function(v) {
          var n = +v, box = this[BOX[p]];
          if (n > MAX_PX) n = MAX_PX;
          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];
            });
            Object.keys(pins).forEach(function(q) {
              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';
            });
            n = box;
          }
          this['__lumiBox' + p] = box;
          this['__lumiLast' + p] = n;
          d.set.call(this, isNaN(n) ? v : n);
        }
      });
    });
  } catch (e) {}
  try {
    var XP = CanvasRenderingContext2D.prototype;
    var px = /(\d*\.?\d+)px/;
    var floorFont = function(ctx) {
      var f = ctx.font, m = px.exec(f);
      if (m && +m[1] >= 4 && +m[1] < MIN_FONT_PX) ctx.font = f.replace(px, MIN_FONT_PX + 'px');
    };
    ['fillText', 'strokeText', 'measureText'].forEach(function(k) {
      var o = XP[k];
      if (typeof o !== 'function') return;
      XP[k] = function() { floorFont(this); return o.apply(this, arguments); };
    });
  } catch (e) {}
})();
</script>

<style id="lumi-runtime">
/* luminous.css */
/*
 * Luminous runtime stylesheet — injected once into every generated widget's
 * <head> by the C++ widget agent (id="lumi-runtime"). Single Source of Truth
 * for ALL design tokens and pre-baked .lumi-* component classes. The SI prompts
 * (design.md / html_generation.jinja2 / chart.jinja2) must NOT re-declare these
 * tokens or component CSS; they only reference them.
 *
 * Sections:
 *   1. Web fonts (Google Sans Flex + Google Sans Code)
 *   2. Light token :root (from previewer tokens.css, verbatim)
 *   3. Dark token overrides — REMAPPED to :root so canvas/D3 readers of
 *      getComputedStyle(document.documentElement) resolve dark values (D3).
 *   4. Short diagram/chart aliases (bridge legacy --surface / --chart-N names).
 *   5. In-scope pre-baked .lumi-* component classes.
 */

/* ============================================================
 * 1. WEB FONTS  (Google Sans Flex + Google Sans Code only)
 *    Material Symbols Outlined is intentionally NOT loaded: no in-scope
 *    .lumi-* control has a functional CSS glyph dependency on it, and the
 *    icon ban forbids decorative icons (Decision D2).
 * ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,300..700;1,300..700&family=Google+Sans+Code:ital,wght,MONO@0,300..700,0..1;1,300..700,0..1&display=swap');

/* ============================================================
 * 2. LIGHT TOKENS (:root)
 * ============================================================ */
:root {
  --body-bg: transparent;
  --ff-sans: 'Google Sans Flex', 'Google Sans Text', 'Google Sans', sans-serif;
  --ff-mono: 'Google Sans Code', 'Google Sans Mono', monospace;

  --lumi-sys-spacing--xxs: 2px;
  --lumi-sys-spacing--xs: 4px;
  --lumi-sys-spacing--s: 8px;
  --lumi-sys-spacing--m: 12px;

/* ============================================================

    --lumi-sys-color--error: #ff4c45;

/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  /* foreground */
  --on-surface: var(--lumi-sys-color--on-surface, #000000);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.55));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */
  --primary: var(--lumi-sys-color--primary, #3186ff);
  --primary-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent-fixed: var(--lumi-sys-color--accent-fixed, #3186ff);
  /* status */
  --positive: var(--lumi-sys-color--positive, #008052);
  --positive-container: var(--lumi-sys-color--positive-container, #daf9d4);
  --error: var(--lumi-sys-color--error, #de2d29);
  --error-container: var(--lumi-sys-color--error-container, #ffdeec);
  /* structure */
  --outline: var(--lumi-sys-color--outline, #727676);
  --stroke-default: var(--lumi-sys-color--stroke-default, #e3e3e3);
  /* chart series 1..10 */
  --chart-1: var(--lumi-sys-color--chart-series-1, #2575fc);
  --chart-2: var(--lumi-sys-color--chart-series-2, #5b6e9e);
  --chart-3: var(--lumi-sys-color--chart-series-3, #228a49);
  --chart-4: var(--lumi-sys-color--chart-series-4, #62991b);
  --chart-5: var(--lumi-sys-color--chart-series-5, #1e564d);
  --chart-6: var(--lumi-sys-color--chart-series-6, #526a45);
  --chart-7: var(--lumi-sys-color--chart-series-7, #2780c4);
  --chart-8: var(--lumi-sys-color--chart-series-8, #997112);
  --chart-9: var(--lumi-sys-color--chart-series-9, #705ec2);
  --chart-10: var(--lumi-sys-color--chart-series-10, #c84288);
  /* code palette */
  --code-background: var(--lumi-sys-color--code-background, #000000);
  --code-primary-text: var(--lumi-sys-color--code-primary-text, #ffffff);
  /* spacing shorthands */
  --spacing-xs: var(--lumi-sys-spacing--xs, 4px);
  --spacing-s: var(--lumi-sys-spacing--s, 8px);
  --spacing-m: var(--lumi-sys-spacing--m, 12px);
  --spacing-l: var(--lumi-sys-spacing--l, 16px);
  --spacing-xl: var(--lumi-sys-spacing--xl, 20px);
  /* radius shorthands */
  --r-s: var(--lumi-sys-shape--small, 8px);
  --r-m: var(--lumi-sys-shape--medium, 12px);
  --r-l: var(--lumi-sys-shape--large, 16px);
  --r-full: var(--lumi-sys-shape--full, 999px);
}

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();

  <script>
    // Safe token resolver
    function getCssVar(name) {
      if (!name) return '';
      const clean = name.replace(/^var\(/, '').replace(/\)$/, '').trim();
      return getComputedStyle(document.documentElement).getPropertyValue(clean.startsWith('--') ? clean : '--' + clean).trim();
    }

    // State definition
    const state = {
      time: 0.0,          // t / t_E (-2.0 to 2.0)
      planetMass: 0.020,  // Mass ratio q
      planetPos: -0.35,   // Planetary offset along x-axis relative to host star
      u0: 0.18,           // Impact parameter (closest distance of host star)
      isPlaying: true,
      lastTimestamp: 0
    };

    let canvas, ctx, rafId;
    // Background starfield generation
    const starfield = Array.from({ length: 65 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.2 + 0.4,
      alpha: Math.random() * 0.6 + 0.2
    }));

    // Calculate Paczynski magnification curve
    function computeMagnification(t, q, planetDx, u0) {
      // Host star path: x_a = t, y_a = u0
      const xa = t;
      const ya = u0;
      const u = Math.sqrt(xa * xa + ya * ya);

      // Standard Paczynski formula for single lens
      const uSq = u * u;
      const A_star = (uSq + 2) / (u * Math.sqrt(uSq + 4));

      // Exoplanet perturbation
      if (q <= 0.0001) {
        return { A: A_star, u: u, isAnomaly: false };
      }

      // Planet position relative to background star (0,0)
      const planetY = ya + 0.12; // slight vertical offset for orbit geometry
      const planetX = xa + planetDx;
      const up = Math.sqrt(planetX * planetX + planetY * planetY);

      // Localized planetary caustic perturbation (secondary blip)
      const anomalyDist = up;
      const planetCore = 0.003 + (1 - q * 10) * 0.002;
      const blipIntensity = (q * 120) / (anomalyDist * anomalyDist + planetCore);
      const GaussianEnvelope = Math.exp(-(anomalyDist * anomalyDist) / 0.04);
      const A_planet = blipIntensity * GaussianEnvelope;

      const A_total = A_star + A_planet;
      const isAnomaly = A_planet > 0.35;

      return { A: A_total, u: u, isAnomaly: isAnomaly };
    }

    function renderCanvas() {
      if (!canvas || !ctx) return;

      const box = canvas.parentElement;
      const w = box.clientWidth || 600;
      const h = box.clientHeight || 340;
      const dpr = window.devicePixelRatio || 1;

      if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Split panels: Top = Cosmic view (52% height), Bottom = Graph (48% height)
      const topH = Math.floor(h * 0.52);
      const bottomH = h - topH;

      // Color Palette dynamic resolution
      const accentColor = getCssVar('--chart-1') || '#3186ff';
      const secondaryColor = getCssVar('--chart-3') || '#0ebc5f';
      const planetColor = getCssVar('--chart-10') || '#ffa6d7';
      const gridColor = getCssVar('--stroke-default') || 'rgba(255, 255, 255, 0.12)';
      const textColor = getCssVar('--on-surface-variant') || 'rgba(255,255,255,0.6)';

      // -------------------------------------------------------------
      // TOP PANEL: Cosmic View
      // -------------------------------------------------------------
      ctx.fillStyle = '#050608';
      ctx.fillRect(0, 0, w, topH);

      // Render Starfield
      starfield.forEach(s => {
        ctx.fillStyle = `rgba(220, 235, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * topH, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Background Star B (Source) at Center (w/2, topH/2)
      const srcX = w / 2;
      const srcY = topH / 2;

      // Calculate current magnification
      const { A, u, isAnomaly } = computeMagnification(state.time, state.planetMass, state.planetPos, state.u0);

      // Dynamic source glow based on magnification
      const baseRadius = 8;
      const lensedRadius = baseRadius * Math.min(Math.sqrt(A), 3.2);

      // Einstein Ring / Halo distortion
      const haloGradient = ctx.createRadialGradient(srcX, srcY, baseRadius * 0.5, srcX, srcY, lensedRadius * 3.5);
      haloGradient.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      haloGradient.addColorStop(0.2, isAnomaly ? 'rgba(255, 120, 180, 0.7)' : 'rgba(120, 200, 255, 0.65)');
      haloGradient.addColorStop(0.6, isAnomaly ? 'rgba(255, 80, 150, 0.25)' : 'rgba(49, 134, 255, 0.2)');
      haloGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = haloGradient;
      ctx.beginPath();
      ctx.arc(srcX, srcY, lensedRadius * 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Background Star B core
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(srcX, srcY, Math.max(3, baseRadius * 0.7), 0, Math.PI * 2);
      ctx.fill();

      // Foreground Lens Star A & Planet position mapping
      // Map state.time (-2.0 to 2.0) to canvas pixel X (15% to 85% width)
      const scaleX = (w * 0.7) / 4.0;
      const lensX = srcX + state.time * scaleX;
      const lensY = srcY + state.u0 * scaleX;

      // Draw Orbit Trajectory Line for Lens Star
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(srcX - 2.0 * scaleX, srcY + state.u0 * scaleX);
      ctx.lineTo(srcX + 2.0 * scaleX, srcY + state.u0 * scaleX);
      ctx.stroke();
      ctx.setLineDash([]);

      // Lens Star A (Orange / Warm host)
      const hostGlow = ctx.createRadialGradient(lensX, lensY, 2, lensX, lensY, 14);
      hostGlow.addColorStop(0, '#ffcc66');
      hostGlow.addColorStop(0.5, 'rgba(255, 170, 50, 0.4)');
      hostGlow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hostGlow;
      ctx.beginPath();
      ctx.arc(lensX, lensY, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffaa33';
      ctx.beginPath();
      ctx.arc(lensX, lensY, 4.5, 0, Math.PI * 2);
      ctx.fill();

      // Exoplanet (if mass > 0)
      if (state.planetMass > 0.0001) {
        const pX = lensX + state.planetPos * scaleX;
        const pY = lensY + 0.12 * scaleX;

        // Dotted connection to host star
        ctx.strokeStyle = 'rgba(255, 166, 215, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(lensX, lensY);
        ctx.lineTo(pX, pY);
        ctx.stroke();

        // Planet rendering
        const planetR = Math.max(2.5, Math.min(6, state.planetMass * 100));
        ctx.fillStyle = planetColor;
        ctx.beginPath();
        ctx.arc(pX, pY, planetR, 0, Math.PI * 2);
        ctx.fill();

        // Planet highlight ring
        ctx.strokeStyle = isAnomaly ? '#ff4c45' : 'rgba(255, 166, 215, 0.6)';
        ctx.beginPath();
        ctx.arc(pX, pY, planetR + 3, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Top Panel Overlay Labels
      ctx.font = "12px 'Google Sans Code', monospace";
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.fillText("BACKGROUND SOURCE STAR (B)", 12, 20);
      
      ctx.fillStyle = '#ffaa33';
      ctx.fillText("LENS STAR (A)", lensX - 35, lensY - 12);

      // Panel Divider Line
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, topH);
      ctx.lineTo(w, topH);
      ctx.stroke();

      // -------------------------------------------------------------
      // BOTTOM PANEL: Dynamic Light Curve Graph
      // -------------------------------------------------------------
      const gy = topH;
      const padding = { left: 45, right: 20, top: 25, bottom: 25 };
      const graphW = w - padding.left - padding.right;
      const graphH = bottomH - padding.top - padding.bottom;

      ctx.fillStyle = '#0c0e14';
      ctx.fillRect(0, gy, w, bottomH);

      // Axis Lines
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      // Horizontal Y=1 Baseline
      const yMinMag = 0.8;
      const yMaxMag = 6.0;
      const mapY = (val) => gy + padding.top + graphH * (1 - (val - yMinMag) / (yMaxMag - yMinMag));
      const mapX = (t) => padding.left + ((t + 2.0) / 4.0) * graphW;

      const yBase = mapY(1.0);
      ctx.moveTo(padding.left, yBase);
      ctx.lineTo(padding.left + graphW, yBase);
      ctx.stroke();

      // Y-axis grid ticks
      [1.0, 3.0, 5.0].forEach(tickVal => {
        const tickY = mapY(tickVal);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.beginPath();
        ctx.moveTo(padding.left, tickY);
        ctx.lineTo(padding.left + graphW, tickY);
        ctx.stroke();

        ctx.font = "10px 'Google Sans Code', monospace";
        ctx.fillStyle = textColor;
        ctx.textAlign = "right";
        ctx.fillText(`${tickVal.toFixed(1)}×`, padding.left - 6, tickY + 3);
      });

      // X-axis baseline & ticks (-2, -1, 0, 1, 2)
      [-2, -1, 0, 1, 2].forEach(tVal => {
        const tickX = mapX(tVal);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.beginPath();
        ctx.moveTo(tickX, gy + padding.top);
        ctx.lineTo(tickX, gy + padding.top + graphH);
        ctx.stroke();

        ctx.font = "10px 'Google Sans Code', monospace";
        ctx.fillStyle = textColor;
        ctx.textAlign = "center";
        ctx.fillText(tVal === 0 ? "0 (t0)" : `${tVal}`, tickX, gy + padding.top + graphH + 16);
      });

      // Draw Light Curve Line
      ctx.beginPath();
      const steps = 220;
      for (let i = 0; i <= steps; i++) {
        const tVal = -2.0 + (i / steps) * 4.0;
        const res = computeMagnification(tVal, state.planetMass, state.planetPos, state.u0);
        const px = mapX(tVal);
        const py = mapY(Math.min(res.A, yMaxMag));

        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }

      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Highlight Playhead / Current Position
      const currentX = mapX(state.time);
      const currentY = mapY(Math.min(A, yMaxMag));

      // Playhead vertical marker
      ctx.strokeStyle = isAnomaly ? '#ff4c45' : 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(currentX, gy + padding.top);
      ctx.lineTo(currentX, gy + padding.top + graphH);
      ctx.stroke();
      ctx.setLineDash([]);

      // Current point pulse ring
      ctx.fillStyle = isAnomaly ? '#ff4c45' : secondaryColor;
      ctx.beginPath();
      ctx.arc(currentX, currentY, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(currentX, currentY, 7, 0, Math.PI * 2);
      ctx.stroke();

      // Axis Labels
      ctx.font = "11px 'Google Sans Code', monospace";
      ctx.fillStyle = textColor;
      ctx.textAlign = "left";
      ctx.fillText("APPARENT BRIGHTNESS A(t)", padding.left + 6, gy + padding.top - 8);
    }

    function updateReadouts() {
      const { A, u, isAnomaly } = computeMagnification(state.time, state.planetMass, state.planetPos, state.u0);

      const magEl = document.getElementById('val-mag');
      const sepEl = document.getElementById('val-sep');
      const blipEl = document.getElementById('val-blip');

      if (magEl) magEl.textContent = `${A.toFixed(2)}×`;
      if (sepEl) sepEl.textContent = `${u.toFixed(2)} θE`;
      if (blipEl) {
        if (state.planetMass <= 0.0001) {
          if (blipEl) blipEl.textContent = 'No Exoplanet';
          blipEl.style.color = getCssVar('--on-surface-variant');
        } else if (isAnomaly) {
          if (blipEl) blipEl.textContent = 'DETECTED!';
          blipEl.style.color = getCssVar('--error');
        } else {
          if (blipEl) blipEl.textContent = 'Active (Sub-threshold)';
          blipEl.style.color = getCssVar('--positive');
        }
      }
    }

    function updateViz() {
      try {
        renderCanvas();
        updateReadouts();
      } catch (err) {
        console.error("Render error in microlens visualizer:", err);
      }
    }

    function animLoop(timestamp) {
      if (!state.lastTimestamp) state.lastTimestamp = timestamp;
      const dt = Math.min(0.05, (timestamp - state.lastTimestamp) / 1000);
      state.lastTimestamp = timestamp;

      if (state.isPlaying) {
        state.time += dt * 0.45;
        if (state.time > 2.0) {
          state.time = -2.0;
        }

        // Sync time slider value & track gradient
        const timeSlider = document.getElementById('slider-time');
        const timeVal = document.getElementById('slider-time-val');
        if (timeSlider) {
          timeSlider.value = state.time.toFixed(2);
          const pct = (state.time - (-2.0)) / (2.0 - (-2.0)) * 100;
          timeSlider.style.setProperty('--progress', pct + '%');
        }
        if (timeVal) {
          if (timeVal) timeVal.textContent = state.time.toFixed(2);
        }
      }

      updateViz();
      rafId = requestAnimationFrame(animLoop);
    }

    function init() {
      canvas = document.getElementById('microlensCanvas');
      if (canvas) {
        ctx = canvas.getContext('2d');
      }

      // Input bindings
      document.querySelectorAll('.lumi-slider').forEach(slider => {
        slider.addEventListener('input', (e) => {
          const key = e.target.dataset.key;
          const val = parseFloat(e.target.value);
          state[key] = val;

          const pct = (val - e.target.min) / (e.target.max - e.target.min) * 100;
          e.target.style.setProperty('--progress', pct + '%');

          const valBadge = document.getElementById(`${e.target.id}-val`);
          if (valBadge) {
            if (valBadge) valBadge.textContent = key === 'planetMass' ? val.toFixed(3) : val.toFixed(2);
          }

          if (key === 'time' && state.isPlaying) {
            // Pause animation if scrubbing time manually
            state.isPlaying = false;
            const playBtn = document.getElementById('btn-play');
            if (playBtn) playBtn.textContent = 'Play';
          }

          updateViz();
        });
      });

      const playBtn = document.getElementById('btn-play');
      if (playBtn) {
        playBtn.addEventListener('click', () => {
          state.isPlaying = !state.isPlaying;
          if (playBtn) playBtn.textContent = state.isPlaying ? 'Pause' : 'Play';
        });
      }

      const resetBtn = document.getElementById('btn-reset');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          state.time = -2.0;
          state.isPlaying = true;
          if (playBtn) playBtn.textContent = 'Pause';

          const timeSlider = document.getElementById('slider-time');
          const timeVal = document.getElementById('slider-time-val');
          if (timeSlider) {
            timeSlider.value = "-2.00";
            timeSlider.style.setProperty('--progress', '0%');
          }
          if (timeVal) timeVal.textContent = "-2.00";

          updateViz();
        });
      }

      // First-frame setup
      updateViz();
      rafId = requestAnimationFrame(animLoop);
    }

    // Dynamic theme & iframe auto-resize setup
    const applyTheme = t => {
      document.documentElement.setAttribute('data-theme', t);
      if (typeof updateViz === 'function') updateViz();
    };

    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }

    window.addEventListener('message', e => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') {
        applyTheme(e.data.theme);
      }
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({ type: 'widget-resize', height: h }, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();

    // Start
    init();
  </script>

<script>/*luminous-slider-normalizer*/(function(){function f(r){if(!r||r.type!=='range')return;var mn=parseFloat(r.min||'0'),mx=parseFloat(r.max||'100'),v=parseFloat(r.value);if(isNaN(v))v=(mn+mx)/2;var p=mx>mn?((v-mn)/(mx-mn))*100:50;r.style.setProperty('--progress',p+'%');r.style.removeProperty('--slider-fill');}function all(){document.querySelectorAll('input[type="range"], .lumi-slider').forEach(f);}document.addEventListener('input',function(e){f(e.target);});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',all);else all();})();</script>
